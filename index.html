
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>PHP CRUD - Student Information</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <!-- CREATE FORM -->
    <div class="container shadow m-5 p-4 mx-auto rounded">

        <h3 class="mb-3">Student Information</h3>

        <form method="post" id="createForm"
              class="d-flex justify-content-around">

            <input class="form-control me-3"
                   type="text"
                   name="stdname"
                   placeholder="Enter Name"
                   required>

            <input class="form-control me-3"
                   type="number"
                   name="stdreg"
                   placeholder="Enter Reg Number"
                   required>

            <input class="btn btn-success"
                   type="submit"
                   value="Submit"
                   name="btn">

        </form>

    </div>


    <!-- UPDATE FORM -->
    <div class="container m-5 p-3 mx-auto"
         id="updateContainer"
         style="display:none;">

        <form method="post" id="updateForm"
              class="d-flex justify-content-around">

            <input type="hidden" name="stdid" id="stdid">

            <input class="form-control me-3"
                   type="text"
                   name="stdname"
                   id="updateName"
                   placeholder="Enter Name"
                   required>

            <input class="form-control me-3"
                   type="number"
                   name="stdreg"
                   id="updateReg"
                   placeholder="Enter Reg Number"
                   required>

            <input class="btn btn-primary"
                   type="submit"
                   value="Update"
                   name="update-btn">

        </form>

    </div>


    <!-- MESSAGE -->
    <div class="container">
        <p id="message"></p>
    </div>


    <!-- READ TABLE -->
    <div class="container">

        <h4>Student Records</h4>

        <table class="table table-bordered">

            <thead>
                <tr>
                    <th>STD ID</th>
                    <th>STD NAME</th>
                    <th>Reg No</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>

        </table>

    </div>


    <script>

       // STUDENT DATA
        let students = [];


        // SAVE STUDENT DATA
        // PHP and MariaDB handle permanent storage
        function saveStudents(){
            loadStudents();
        }


        // READ STUDENTS
        function loadStudents(){

            fetch('index.php?read=1')

            .then(response => {
                if(!response.ok){
                    throw new Error('HTTP Error: ' + response.status);
                }
                return response.json();
            })

            .then(data => {

                students = data;

                let table = document.getElementById('studentTable');

                table.innerHTML = '';

                if(students.length > 0){

                    students.forEach(rd => {

                        let row = document.createElement('tr');

                        row.innerHTML = `
                            <td>${rd.id}</td>
                            <td></td>
                            <td>${rd.stdreg}</td>
                            <td></td>
                            <td></td>
                        `;

                        row.children[1].textContent = rd.stdname;


                        // UPDATE BUTTON
                        let updateBtn = document.createElement('a');

                        updateBtn.href = '#';
                        updateBtn.className = 'btn btn-info';
                        updateBtn.textContent = 'Update';

                        updateBtn.onclick = function(e){

                            e.preventDefault();

                            editStudent(rd.id);

                        };

                        row.children[3].appendChild(updateBtn);


                        // DELETE BUTTON
                        let deleteBtn = document.createElement('a');

                        deleteBtn.href = '#';
                        deleteBtn.className = 'btn btn-danger';
                        deleteBtn.textContent = 'Delete';

                        deleteBtn.onclick = function(e){

                            e.preventDefault();

                            deleteStudent(rd.id);

                        };

                        row.children[4].appendChild(deleteBtn);

                        table.appendChild(row);

                    });

                }

                else{

                    table.innerHTML = `
                        <tr>
                            <td colspan="5">No data to show</td>
                        </tr>
                    `;

                }

            })

            .catch(error => {

                document.getElementById('message').textContent =
                    'Error loading students: ' + error.message;

                console.error(error);

            });

        }


        // CREATE STUDENT
        document.getElementById('createForm')
        .addEventListener('submit', function(e){

            e.preventDefault();

            let formData = new FormData(this);
            formData.append('btn', '1'); // <-- ADD THIS LINE

            fetch('index.php', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if(!response.ok){
                    throw new Error('HTTP Error: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('message').textContent =
                    data.message || data.error;

                if(data.success){
                    this.reset();
                    loadStudents();
                }
            })
            .catch(error => {
                document.getElementById('message').textContent =
                    'Error: ' + error.message;
                console.error(error);
            });
        });


        // GET STUDENT FOR UPDATE
        function editStudent(id){

            fetch('index.php?update=' + encodeURIComponent(id))

            .then(response => {
                if(!response.ok){
                    throw new Error('HTTP Error: ' + response.status);
                }
                return response.json();
            })

            .then(rx => {

                if(!rx){
                    throw new Error('Student not found');
                }

                document.getElementById('stdid').value = rx.id;

                document.getElementById('updateName').value = rx.stdname;

                document.getElementById('updateReg').value = rx.stdreg;

                document.getElementById('updateContainer').style.display =
                    'block';

            })

            .catch(error => {

                document.getElementById('message').textContent =
                    'Error: ' + error.message;

            });

        }


        // UPDATE STUDENT
        document.getElementById('updateForm')
        .addEventListener('submit', function(e){

            e.preventDefault();

            let formData = new FormData(this);
            formData.append('update-btn', '1'); // <-- ADD THIS LINE

            fetch('index.php', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if(!response.ok){
                    throw new Error('HTTP Error: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('message').textContent =
                    data.message || data.error;

                if(data.success){
                    this.reset();
                    document.getElementById('updateContainer').style.display = 'none';
                    loadStudents();
                }
            })
            .catch(error => {
                document.getElementById('message').textContent =
                    'Error: ' + error.message;
            });
        });


        // DELETE STUDENT
        function deleteStudent(id){

            if(confirm('Are you sure you want to delete?')){

                let formData = new FormData();

                formData.append('delete', id);

                fetch('index.php', {
                    method: 'POST',
                    body: formData
                })

                .then(response => {
                    if(!response.ok){
                        throw new Error('HTTP Error: ' + response.status);
                    }
                    return response.json();
                })

                .then(data => {

                    document.getElementById('message').textContent =
                        data.message || data.error;

                    if(data.success){

                        loadStudents();

                    }

                })

                .catch(error => {

                    document.getElementById('message').textContent =
                        'Error: ' + error.message;

                });

            }

        }


        // LOAD DATA WHEN PAGE OPENS
        loadStudents();

    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
